name: Сборка приложения

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: Версия для браузера (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка сайта
        run: |
          mkdir _site
          cp -r www/* _site/
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Установка зависимостей
        run: npm install
      - name: Создание Android-проекта
        run: |
          npx cap add android
          # versionCode должен расти, иначе новый apk не установится поверх старого
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          npx cap sync android
      - name: Сборка
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Подпись
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs/apk/release
          "$BT/zipalign" -p 4 "$OUT/app-release-unsigned.apk" aligned.apk
          "$BT/apksigner" sign --ks android-signing/release.keystore --ks-pass pass:gamecatalog --key-pass pass:gamecatalog --out game-catalog.apk aligned.apk
          "$BT/apksigner" verify game-catalog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: game-catalog-apk
          path: game-catalog.apk
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # при повторном запуске той же сборки старый релиз с этим номером удаляем
          gh release delete "v${GITHUB_RUN_NUMBER}" --yes --cleanup-tag || true
          gh release create "v${GITHUB_RUN_NUMBER}" game-catalog.apk --title "Каталог игр, сборка ${GITHUB_RUN_NUMBER}" --notes "APK для Android. Версия для браузера: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
