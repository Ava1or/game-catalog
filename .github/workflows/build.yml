name: Сборка приложения

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  test:
    name: Проверка логики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тесты
        run: node --test tests/logic.test.js tests/smoke.test.js tests/server.test.mjs

  web:
    name: Версия для браузера (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка сайта
        run: |
          mkdir _site
          cp -r www/* _site/
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}/" _site/sw.js
          python3 tools/build_server_pack.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Установка зависимостей
        run: npm install
      - name: Создание Android-проекта
        run: |
          npx cap add android
          # versionCode должен расти, иначе новый apk не установится поверх старого
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" android/app/build.gradle || { echo "::error::Не удалось задать versionCode: изменился шаблон Capacitor"; exit 1; }
          # иконка приложения: обычные png вместо адаптивной иконки по умолчанию
          cp -r android-res/. android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # приём текста из «Поделиться» других приложений
          cp android-src/*.java android/app/src/main/java/com/example/gamecatalog/
          python3 tools/patch_manifest.py
          npx cap sync android
      - name: Сборка
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Подпись
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            KS=release.keystore; PASS="$KEYSTORE_PASS"; ALIAS="${KEY_ALIAS:-gamecatalog}"
            echo "Подпись личным ключом из GitHub Secrets"
          else
            KS=android-signing/release.keystore; PASS=gamecatalog; ALIAS=gamecatalog
            echo "::warning::Используется ключ из репозитория (он публичный). Для безопасности перенесите ключ в GitHub Secrets, см. README."
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs/apk/release
          "$BT/zipalign" -p 4 "$OUT/app-release-unsigned.apk" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out game-catalog.apk aligned.apk
          "$BT/apksigner" verify game-catalog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: game-catalog-apk
          path: game-catalog.apk
          retention-days: 14
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # при повторном запуске той же сборки старый релиз с этим номером удаляем
          gh release delete "v${GITHUB_RUN_NUMBER}" --yes --cleanup-tag || true
          gh release create "v${GITHUB_RUN_NUMBER}" game-catalog.apk --title "Каталог игр, сборка ${GITHUB_RUN_NUMBER}" --notes "APK для Android. Версия для браузера: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          # оставляем 10 последних релизов
          gh release list --limit 100 --json tagName -q '.[10:] | .[].tagName' | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
