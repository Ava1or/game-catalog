<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="Каталог игр: коллекции, серии, поиск в IGDB, работа без интернета">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Каталог игр</title>
</head>
<body>
<main id="view"></main>
<div id="selbar" class="selbar hidden"></div>
<button id="fab" class="fab" data-act="fab" aria-label="Добавить">+</button>
<nav id="tabs">
  <button data-act="tab" data-tab="library" aria-label="Каталог"><i>🎮</i><span>Каталог</span></button>
  <button data-act="tab" data-tab="collections" aria-label="Коллекции"><i>🗂</i><span>Коллекции</span></button>
  <button data-act="tab" data-tab="series" aria-label="Серии"><i>📚</i><span>Серии</span></button>
  <button data-act="tab" data-tab="inbox" aria-label="Разобрать"><i>📝</i><span>Разобрать</span></button>
  <button data-act="tab" data-tab="search" aria-label="Поиск"><i>🔍</i><span>Поиск</span></button>
  <button data-act="tab" data-tab="settings" aria-label="Настройки"><i>⚙️</i><span>Настройки</span></button>
</nav>
<div id="layer"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
